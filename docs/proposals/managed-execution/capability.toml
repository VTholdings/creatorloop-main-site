# INACTIVE REVIEW TEMPLATE. Deployment/resources/secrets require exact authorization.
name = "creatorloop-training-execution-capability"
account_id = "2a3b96a0b37850cd03107131baa66b6d"
main = "../../../workers/training-managed/capability.mjs"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[version_metadata]
binding = "WORKER_VERSION_METADATA"

[vars]
MANAGED_CONFIG_JSON = "{}"

[[durable_objects.bindings]]
name = "STATE"
class_name = "TrainingExecutionState"

# Managed state class registration only; NOT a Console D1 schema migration.
[[migrations]]
tag = "training-execution-state-v1"
new_sqlite_classes = ["TrainingExecutionState"]

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "creatorloop-training-execution-evidence"

# Provision privately only after exact approved scope and deployment separation.
# GITHUB_APP_PRIVATE_KEY: separate from Owner admission RSA key.
# TRAINING_PROVIDER_TOKEN: exact short-lived TRAINING capability, never broad account token.
[observability]
enabled = false
