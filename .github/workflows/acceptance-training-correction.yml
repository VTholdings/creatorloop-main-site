name: CreatorLoop acceptance - approved training configuration correction
run-name: Training-only Pages correction and verification for ${{ github.sha }}
on:
  push:
    branches: [team-access-directory]
    paths:
      - .github/workflows/acceptance-training-correction.yml
      - scripts/acceptance/training-pages-correction.mjs
      - scripts/lib/training-pages-correction.mjs
      - tests/training-pages-correction.test.js
permissions:
  contents: read
concurrency:
  group: creatorloop-acceptance-training-correction
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'VTholdings/creatorloop-main-site' && github.ref == 'refs/heads/team-access-directory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      main_sha: ${{ steps.release.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: python3 -m py_compile scripts/retention-manifest.py scripts/team-migration-preflight.py
      - name: Record reviewed code references
        id: release
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "main_sha=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"
  training-correction:
    name: Protected training-only Pages correction and read-only verification
    needs: validate
    if: github.repository == 'VTholdings/creatorloop-main-site' && github.ref == 'refs/heads/team-access-directory' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: creatorloop-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fence an obsolete correction run
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/team-access-directory)" = "$GITHUB_SHA"
      - name: Apply only approved training Pages values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCEPTANCE_ENVIRONMENT: creatorloop-acceptance
          APPROVED_CHANGE: CREATORLOOP_TRAINING_BINDINGS_V1
        run: node scripts/acceptance/training-pages-correction.mjs
      - name: Verify Cloudflare metadata only after correction
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCEPTANCE_ENVIRONMENT: creatorloop-acceptance
          EXPECTED_MAIN_SHA: ${{ needs.validate.outputs.main_sha }}
        run: node scripts/acceptance/cloudflare-readonly.mjs
      - name: Keep sanitized correction and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatorloop-training-correction-${{ github.sha }}
          path: acceptance-evidence/*.json
          if-no-files-found: ignore
          retention-days: 14
