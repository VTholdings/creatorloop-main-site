name: CreatorLoop bounded corporate migration
on:
  push:
    branches: [corporate/migration-20261015]
permissions:
  contents: read
concurrency:
  group: creatorloop-corporate-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.repository == 'VTholdings/creatorloop-main-site'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MIGRATION_PHASE: stage
      CLOUDFLARE_ACCOUNT_ID: 2a3b96a0b37850cd03107131baa66b6d
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate credential and preserve current state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CREATORLOOP_CF_MIGRATION_TOKEN }}
        run: python3 corporate/tools/migrate_20261015.py
      - name: Preserve nonsecret verification and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corporate-migration-${{ github.run_id }}
          path: migration-evidence/
          if-no-files-found: error
          retention-days: 30
