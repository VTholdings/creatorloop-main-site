name: CreatorLoop acceptance - production Gate 1 read-only inspection
run-name: Production Gate 1 read-only inspection for ${{ github.sha }}
on:
  push:
    branches: [team-access-directory]
    paths:
      - .github/workflows/acceptance-production-schema.yml
      - scripts/lib/production-schema-inspection.mjs
      - scripts/production-inspection/**
      - tests/production-schema-inspection.test.js
permissions:
  contents: read
  actions: read
concurrency:
  group: creatorloop-acceptance-production-schema
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'VTholdings/creatorloop-main-site' && github.ref == 'refs/heads/team-access-directory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      main_sha: ${{ steps.references.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: node --check scripts/lib/production-schema-inspection.mjs && node --check scripts/production-inspection/live.mjs
      - run: python3 -m py_compile scripts/production-inspection/baseline.py
      - id: references
        run: echo "main_sha=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"
  production-inspection:
    name: Protected PRODUCTION Gate 1 - read-only, separate Owner approval
    needs: validate
    if: github.repository == 'VTholdings/creatorloop-main-site' && github.ref == 'refs/heads/team-access-directory' && github.event_name == 'push' && github.run_attempt == 1
    environment:
      name: creatorloop-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fence stale and replayed requests
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/team-access-directory)" = "$GITHUB_SHA"
      - name: Retrieve accepted encrypted evidence - no new export
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11317109290'
          run-id: 37242966914
          github-token: ${{ github.token }}
          path: production-private
          merge-multiple: true
      - name: Retrieve completed training PASS receipt - no training inspection
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11320388581'
          run-id: 37248108426
          github-token: ${{ github.token }}
          path: production-private/training-pass
          merge-multiple: true
      - name: Authenticate accepted backup and obtain original production schema locally
        env:
          CREATORLOOP_BACKUP_PASSPHRASE: ${{ secrets.CREATORLOOP_BACKUP_PASSPHRASE }}
        run: |
          cd production-private
          echo 'd9d3ef5b502c70f1801693a73f7b516c954ac402a480300f4b1cb25d890ce191  owner-transfer.clbackup' | sha256sum --check
          sha256sum --check owner-transfer.clbackup.sha256
          node ../scripts/backup-envelope.mjs decrypt owner-transfer.clbackup accepted.zip
          cd ..
          python3 scripts/production-inspection/baseline.py production-private/accepted.zip production-private/baselines
      - name: Production Gate 1 fixed SQL reads only - stop on first discrepancy
        id: inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ needs.validate.outputs.main_sha }}
          ACCEPTANCE_ENVIRONMENT: creatorloop-acceptance
          SCHEMA_INSPECTION_SCOPE: PRODUCTION_ONLY
        run: node scripts/production-inspection/live.mjs
      - name: Record preparation failure without private evidence
        if: always() && steps.inspect.outcome != 'success'
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('production-evidence/PRODUCTION.json');p.parent.mkdir(exist_ok=True)
          if not p.exists():p.write_text(json.dumps({'protocol':'CREATORLOOP_D1_SCHEMA_INSPECTION_V1','environment':'PRODUCTION','databaseId':'c4993a97-5835-4c6c-af06-7020fa8d4f2a','releaseSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'status':'NOT_EXECUTED_PREPARATION_BLOCKED','blockers':[{'code':'SCHEMA_INSPECTION_PREPARATION_BLOCKED'}],'remoteMigrationsApplied':False,'remoteRestorePerformed':False,'productionDeployed':False})+'\n')
          PY
      - name: Retain sanitized production receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatorloop-production-schema-${{ github.sha }}
          path: production-evidence/PRODUCTION.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove ephemeral private evidence
        if: always()
        run: rm -rf production-private
      - name: Preserve all write and release holds
        if: always()
        run: echo 'Production Gate 1 only. No writes, Gate 2, migration, remote restore, executor activation, configuration change, deployment or merge. PR 18 remains draft.' >> "$GITHUB_STEP_SUMMARY"
