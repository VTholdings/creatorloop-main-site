name: CreatorLoop acceptance - backup secret delivery diagnostic only
run-name: Backup secret delivery diagnostic for ${{ github.sha }}
on:
  push:
    branches: [team-access-directory]
    paths:
      - .github/workflows/acceptance-secret-diagnostic.yml
      - scripts/lib/backup-key-delivery.mjs
      - scripts/diagnostics/backup-secret-presence.mjs
      - tests/backup-key-delivery.test.js
permissions:
  contents: read
concurrency:
  group: creatorloop-acceptance-backup-secret-diagnostic
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'VTholdings/creatorloop-main-site' && github.ref == 'refs/heads/team-access-directory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
  secret-delivery:
    name: Protected secret delivery check - no exports or infrastructure calls
    needs: validate
    if: github.repository == 'VTholdings/creatorloop-main-site' && github.ref == 'refs/heads/team-access-directory' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: creatorloop-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fence obsolete diagnostics
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/team-access-directory)" = "$GITHUB_SHA"
      - name: Test only delivery booleans and existing validation thresholds
        env:
          CREATORLOOP_BACKUP_PASSPHRASE: ${{ secrets.CREATORLOOP_BACKUP_PASSPHRASE }}
          BACKUP_SECRET_CONTEXT_PRESENT: ${{ secrets.CREATORLOOP_BACKUP_PASSPHRASE != '' }}
          ACCEPTANCE_ENVIRONMENT: creatorloop-acceptance
        run: node scripts/diagnostics/backup-secret-presence.mjs
      - name: Retain value-free diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatorloop-backup-key-delivery-${{ github.sha }}
          path: diagnostic-evidence/backup-key-delivery.json
          if-no-files-found: error
          retention-days: 14
