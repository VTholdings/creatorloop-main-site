name: Phase 18 TRAINING dispatch credential custody
on:
  workflow_dispatch:
    inputs:
      expected_execution_sha:
        description: Exact Owner-reviewed TRAINING execution SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: creatorloop-phase18-dispatch-credential-custody-v1
  cancel-in-progress: false
jobs:
  credential-custody:
    if: >-
      github.repository == 'VTholdings/creatorloop-main-site' &&
      github.ref == 'refs/heads/team-access-directory' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      github.actor == 'vt-creatorloop-training-executor[bot]' &&
      github.actor_id == '341571374' &&
      github.triggering_actor == 'vt-creatorloop-training-executor[bot]' &&
      inputs.expected_execution_sha == github.sha
    environment: creatorloop-training-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.3
      - name: Read exact reviewed public helper
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          curl --fail --silent --show-error --proto '=https' \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/scripts/owner-bootstrap/phase18-dispatch-credential-custody.cjs" \
            -o "$RUNNER_TEMP/credential-custody.cjs"
          printf '%s\n' "9148fdd5d14ec447f7a664731533664b2f5735897e90bd9cd937bce2aeeb06ea  $RUNNER_TEMP/credential-custody.cjs" | sha256sum -c -
      - name: Create at most one credential and encrypt private custody
        env:
          CF_SETUP_TOKEN: ${{ secrets.CREATORLOOP_PHASE18_DISPATCH_SETUP_TOKEN }}
          CUSTODY_PASSWORD: ${{ secrets.CREATORLOOP_PHASE18_DISPATCH_CUSTODY_PASSWORD }}
          EXPECTED_SHA: ${{ inputs.expected_execution_sha }}
        shell: bash
        run: node "$RUNNER_TEMP/credential-custody.cjs"
      - name: Retain encrypted custody only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase18-dispatch-encrypted-custody-${{ github.run_id }}
          path: ${{ runner.temp }}/phase18-dispatch-custody.enc.json
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
