name: CreatorLoop acceptance - read-only Cloudflare verification
run-name: Read-only Cloudflare verification for ${{ github.sha }}

# A branch push queues approval without putting this workflow on main.
# GitHub's environment reviewer remains the authority to release the secret.
on:
  push:
    branches: [team-access-directory]
    paths:
      - .github/workflows/acceptance-readonly.yml
      - scripts/acceptance/**
      - scripts/lib/cloudflare-readonly.mjs
      - tests/cloudflare-readonly.test.js

permissions:
  contents: read

concurrency:
  group: creatorloop-acceptance-readonly
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'VTholdings/creatorloop-main-site' && github.ref == 'refs/heads/team-access-directory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      main_sha: ${{ steps.release.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: python3 -m py_compile scripts/retention-manifest.py scripts/team-migration-preflight.py
      - name: Record reviewed code references
        id: release
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "main_sha=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"

  cloudflare-readonly:
    name: Protected read-only Cloudflare verification
    needs: validate
    if: github.repository == 'VTholdings/creatorloop-main-site' && github.ref == 'refs/heads/team-access-directory' && github.event_name == 'push' && github.actor == 'Creatorloopzone' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: creatorloop-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fence an obsolete acceptance run
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/team-access-directory)" = "$GITHUB_SHA"
      - name: Read Cloudflare metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCEPTANCE_ENVIRONMENT: creatorloop-acceptance
          EXPECTED_MAIN_SHA: ${{ needs.validate.outputs.main_sha }}
        run: |
          umask 077
          trap 'rm -f acceptance-evidence/cloudflare-readonly.json' EXIT
          result=0
          node scripts/acceptance/cloudflare-readonly.mjs || result=$?
          unset CLOUDFLARE_API_TOKEN
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          const report=JSON.parse(await readFile('acceptance-evidence/cloudflare-readonly.json','utf8'));
          for(const {code,environment,slot,status,providerCodes,path} of report.blockers){
            const resource=path?.includes('/tokens/')?'TOKEN_VERIFICATION':
              path?.includes('/pages/')?'PAGES':
              path?.includes('/access/')?'ACCESS':
              path?.includes('/d1/')?'D1_METADATA':undefined;
            console.log(JSON.stringify({code,environment,slot,status,providerCodes,resource}));
          }
          JS
          exit "$result"
