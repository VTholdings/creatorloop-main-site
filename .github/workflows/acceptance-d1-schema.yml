name: CreatorLoop acceptance - training-only D1 schema inspection
run-name: Gate 1 training-only read-only D1 inspection for ${{ github.sha }}
on:
  push:
    branches: [team-access-directory]
    paths:
      - .github/workflows/acceptance-d1-schema.yml
      - scripts/lib/d1-schema-inspection.mjs
      - scripts/inspection/**
      - tests/d1-schema-inspection.test.js
permissions:
  contents: read
  actions: read
concurrency:
  group: creatorloop-acceptance-d1-schema-inspection
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'VTholdings/creatorloop-main-site' && github.ref == 'refs/heads/team-access-directory'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      main_sha: ${{ steps.references.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: python3 -m py_compile scripts/inspection/d1-schema-baseline.py
      - id: references
        run: echo "main_sha=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"
  schema-inspection:
    name: Protected Gate 1 - TRAINING ONLY, production held
    needs: validate
    if: github.repository == 'VTholdings/creatorloop-main-site' && github.ref == 'refs/heads/team-access-directory' && github.event_name == 'push' && github.run_attempt == 1
    environment:
      name: creatorloop-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fence obsolete and replayed inspection requests
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/team-access-directory)" = "$GITHUB_SHA"
      - name: Retrieve existing accepted encrypted transfer evidence - no new backup
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '11317109290'
          run-id: 37242966914
          github-token: ${{ github.token }}
          path: schema-private
          merge-multiple: true
      - name: Verify pinned ciphertext and authenticate accepted evidence locally
        env:
          CREATORLOOP_BACKUP_PASSPHRASE: ${{ secrets.CREATORLOOP_BACKUP_PASSPHRASE }}
        run: |
          cd schema-private
          echo 'd9d3ef5b502c70f1801693a73f7b516c954ac402a480300f4b1cb25d890ce191  owner-transfer.clbackup' | sha256sum --check
          sha256sum --check owner-transfer.clbackup.sha256
          node ../scripts/backup-envelope.mjs decrypt owner-transfer.clbackup accepted.zip
      - name: Corroborate accepted training manifests and migration hashes locally
        run: python3 scripts/inspection/d1-schema-baseline.py schema-private/accepted.zip schema-private/baselines --training-only
      - name: Inspect training only through exact read-only SQL allowlist
        id: inspect
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ needs.validate.outputs.main_sha }}
          ACCEPTANCE_ENVIRONMENT: creatorloop-acceptance
          SCHEMA_INSPECTION_SCOPE: TRAINING_ONLY
        run: node scripts/inspection/d1-schema-live.mjs
      - name: Record preparation blockers without private evidence
        if: always() && steps.inspect.outcome != 'success'
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path('schema-evidence');out.mkdir(exist_ok=True)
          for env,dbid in [('TRAINING','12dbfa51-ca9c-475b-bb1b-ca90ac8bd7f0'),('PRODUCTION','c4993a97-5835-4c6c-af06-7020fa8d4f2a')]:
              p=out/(env+'.json')
              if not p.exists():p.write_text(json.dumps({'protocol':'CREATORLOOP_D1_SCHEMA_INSPECTION_V1','environment':env,'databaseId':dbid,'releaseSha':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],'status':'NOT_AUTHORIZED_PRODUCTION_HELD' if env=='PRODUCTION' else 'NOT_EXECUTED_PREPARATION_BLOCKED','blockers':[{'code':'PRODUCTION_INSPECTION_NOT_AUTHORIZED' if env=='PRODUCTION' else 'SCHEMA_INSPECTION_PREPARATION_BLOCKED'}],'remoteMigrationsApplied':False,'remoteRestorePerformed':False,'productionDeployed':False})+'\n')
          PY
      - name: Retain only sanitized database-specific inspection receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatorloop-d1-schema-inspection-${{ github.sha }}
          path: |
            schema-evidence/TRAINING.json
            schema-evidence/PRODUCTION.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove ephemeral decrypted evidence and private baselines
        if: always()
        run: rm -rf schema-private
      - name: Preserve release and Gate 2 holds
        if: always()
        run: echo 'TRAINING Gate 1 only. Production inspection held. PR 18 remains draft. No migration, remote restore, atomicity/write testing, executor activation, configuration change or deployment.' >> "$GITHUB_STEP_SUMMARY"
